  source: synthetic
  size: small
  format: csv

# 모델 설정
model:
  type: example
  architecture: baseline
  hyperparameters:
    learning_rate: 0.001
    batch_size: 32
    epochs: 10

# 평가 메트릭
metrics:
  - accuracy
  - loss
  - f1_score
