# Module 99: 텍스트-이미지
# Configuration file

module:
  id: 99
  name: 텍스트-이미지
  english_name: Text-to-Image Generation
  topics: DALL-E, Imagen, 멀티모달

# 학습 관련 설정
learning:
  difficulty: intermediate
  estimated_hours: 5
  prerequisites: []

# 데이터 설정
