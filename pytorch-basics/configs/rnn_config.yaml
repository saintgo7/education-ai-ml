# RNN/LSTM 학습 설정
# Usage: python scripts/train_rnn.py --config configs/rnn_config.yaml

# 모델 설정
model: lstm  # lstm, gru
embed_size: 128
hidden_size: 256
num_layers: 2
dropout: 0.5

# 데이터 설정
seq_length: 100
vocab_size: null  # 자동 계산

# 학습 설정
batch_size: 64
learning_rate: 0.001
epochs: 20
clip_grad: 1.0

# 스케줄러 설정
scheduler:
  type: reduce_on_plateau
  patience: 3
  factor: 0.5

# 생성 설정
generation:
  temperature: 0.8
  max_length: 500

# 체크포인트 설정
checkpoint:
  save_dir: ../checkpoints
  save_best: true
  save_every: 5

# 로깅 설정
logging:
  level: INFO
  tensorboard: true
  log_interval: 100
