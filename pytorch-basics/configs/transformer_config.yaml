# Transformer 학습 설정
# Usage: python scripts/train_transformer.py --config configs/transformer_config.yaml

# 모델 아키텍처
model:
  d_model: 512
  num_heads: 8
  num_encoder_layers: 6
  num_decoder_layers: 6
  d_ff: 2048
  dropout: 0.1
  max_seq_length: 512

# 어휘 설정
vocab:
  src_vocab_size: 10000
  tgt_vocab_size: 10000
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2

# 학습 설정
training:
  batch_size: 32
  learning_rate: 0.0001
  epochs: 10
  warmup_steps: 4000
  label_smoothing: 0.1
  clip_grad: 1.0

# 옵티마이저 설정
optimizer:
  type: adam
  betas: [0.9, 0.98]
  eps: 1.0e-9
  weight_decay: 0.0001

# 스케줄러 설정 (Noam scheduler)
scheduler:
  type: noam
  warmup_steps: 4000
  factor: 1.0

# 데이터 설정
data:
  train_file: null
  val_file: null
  test_file: null
  max_length: 512
  num_workers: 4

# 체크포인트 설정
checkpoint:
  save_dir: ../checkpoints
  save_best: true
  save_every: 1
  resume: null

# 로깅 설정
logging:
  level: INFO
  tensorboard: true
  log_interval: 100
  eval_interval: 1000

# 추론 설정
inference:
  beam_size: 4
  max_decode_length: 100
  length_penalty: 0.6
